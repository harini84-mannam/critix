{% extends 'registration/auth_base.html' %}
{% block title %}Password Updated{% endblock %}
{% block heading %}Password updated{% endblock %}
{% block subheading %}You can now sign in with your new password.{% endblock %}
{% block card %}
    <div class="text-center space-y-6">
        <div class="mx-auto w-14 h-14 rounded-2xl bg-emerald-500/10 flex items-center justify-center">
            <i data-lucide="check-circle-2" class="w-7 h-7 text-emerald-400"></i>
        </div>
        <a href="{% url 'login' %}" class="inline-block w-full bg-brand-primary hover:bg-brand-accent text-white font-bold py-4 rounded-2xl transition-all">Sign in</a>
    </div>
{% endblock %}
